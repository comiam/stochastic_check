[project]
name = "stochastic-check"
version = "0.1.0"
description = "Stochastic layer-wise Hessian trace estimation: single-pass Hutchinson vs Hutch++/BL-diag/K-FAC"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Maxim Bolshim", email = "maxim.bolshim@yandex.ru"},
    {name = "Alexander Kugaevskikh", email = "a-kugaevskikh@yandex.ru"},
]
keywords = [
    "hessian",
    "hutchinson",
    "hutch++",
    "k-fac",
    "label-noise",
    "second-order",
    "neural-networks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "asdfghjkl>=0.1a3",
]

[project.urls]
Repository = "https://github.com/comiam/stochastic-check"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "flake8>=7.0",
    "ruff>=0.4",
    "black>=24.0",
    "pytest>=8.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "E741", "W605"]

[tool.ruff.lint.isort]
known-first-party = ["hessian", "stochastic_check", "paper_data", "lab_orchestrator"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "numpy.*",
    "matplotlib.*",
    "scipy.*",
    "asdfghjkl.*",
    "asdl.*",
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501", "W503", "E741"]
per-file-ignores = ["__init__.py:F401"]

[tool.pytest.ini_options]
testpaths = ["hessian/tests", "stochastic_check/tests"]

[tool.uv]
package = false
